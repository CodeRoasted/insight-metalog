# release-publish.yml
#
# Build insight_metalog at the tagged version and attach a `conan cache save`
# tarball to the corresponding GitHub Release. Downstream consumers restore
# it with `conan cache restore`.
#
# Pin policy: tag must match vMAJOR.MINOR.PATCH and conanfile.py `version =`
# must equal the tag exactly. Mismatches abort the publish.
#
# Triggers:
#   * Push of a vX.Y.Z tag.
#   * Manual workflow_dispatch with an explicit tag (re-run after transient
#     failure without re-tagging).

name: Release publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CONAN_PROFILE: linux-gcc15-release
      INSIGHT_CANON_REPO: CodeRoasted/insight-canon
      CR_PIN_INSIGHT_CANON: '1.5.3'

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip build-essential
          # Pin the dev-validated CMake 4.3.x workspace-wide (dev/CI parity). coderoast_server arms
          # `import std` (CXX_MODULE_STD, gated by the experimental UUID 451f2fe2 — present only in
          # CMake 4.3.x); Ubuntu's apt cmake (Noble 3.28) lacks that gate. Harmless / kept consistent
          # in repos that don't arm import std yet.
          sudo python3 -m pip install --break-system-packages "cmake==4.3.1"
          hash -r
          case "$(cmake --version | head -1)" in *" 4.3."*) cmake --version ;; *) echo "::error::expected CMake 4.3.x (got: $(cmake --version | head -1))"; exit 1 ;; esac

      - name: Provision gcc-15.3 toolchain (PR124309 fix; replaces PPA gcc-15 = 15.2)
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-gcc153@main

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.28.1"
          home: ${{ env.CONAN_HOME }}
          cache_packages: false
          profile_detect: false

      - name: Cache conan dep binaries (openssl/boost/drogon/… — keyed on the dep set + profile)
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-gcc153-${{ runner.os }}-${{ hashFiles('**/conanfile.py', 'linux-gcc15-release') }}
          restore-keys: |
            conan-gcc153-${{ runner.os }}-

      - name: Setup Conan profile
        run: |
          mkdir -p "$CONAN_HOME/profiles"
          cp linux-gcc15-release "$CONAN_HOME/profiles/linux-gcc15-release"

      - name: Vendor insight_canon from insight-canon release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_fetch_conan_package.sh insight_canon "$CR_PIN_INSIGHT_CANON" "$INSIGHT_CANON_REPO"

      - name: Verify recipe version matches tag
        run: |
          set -euo pipefail
          RECIPE_VERSION="$(sed -nE "s/^[[:space:]]*version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"]/\1/p" conanfile.py | head -n1 || true)"
          if [[ "$RECIPE_VERSION" != "${{ steps.tag.outputs.version }}" ]]; then
            echo "::error::conanfile.py version='$RECIPE_VERSION' != tag '${{ steps.tag.outputs.tag }}'"
            exit 1
          fi

      - name: Build package
        run: |
          conan create . \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing \
            --build-test=missing

      - name: Export Conan tarball
        run: |
          set -euo pipefail
          mkdir -p release-assets
          PKG_VER="${{ steps.tag.outputs.version }}"
          conan cache save "insight_metalog/${PKG_VER}:*" \
            --file="release-assets/insight_metalog-${PKG_VER}.tgz"
          ls -lh release-assets/

      - name: Attach tarball to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated Conan-package release for $TAG.

          The attached \`.tgz\` is produced by \`conan cache save\` and consumed
          downstream by \`conan cache restore\`."
          fi
          gh release upload "$TAG" release-assets/*.tgz --clobber
