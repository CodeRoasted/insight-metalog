# release-publish.yml
#
# Build insight_metalog at the tagged version and attach a `conan cache save`
# tarball to the corresponding GitHub Release. Downstream consumers restore
# it with `conan cache restore`.
#
# Pin policy: tag must match vMAJOR.MINOR.PATCH and conanfile.py `version =`
# must equal the tag exactly. Mismatches abort the publish.
#
# Triggers:
#   * Push of a vX.Y.Z tag.
#   * Manual workflow_dispatch with an explicit tag (re-run after transient
#     failure without re-tagging).

name: Release publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CONAN_PROFILE: linux-gcc13-release
      INSIGHT_REPO: coderoast-dev/insight
      CR_PIN_INSIGHT: '1.2.8'

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip build-essential

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          home: ${{ env.CONAN_HOME }}
          cache_packages: true
          profile_detect: false

      - name: Vendor insight_sequence from insight release
        env:
          GH_TOKEN: ${{ secrets.INSIGHT_RELEASE_TOKEN }}
        run: |
          for pkg in insight_core insight_tokenization insight_sequence; do
            bash scripts/ci_fetch_conan_package.sh "$pkg" "$CR_PIN_INSIGHT" "$INSIGHT_REPO"
          done

      - name: Verify recipe version matches tag
        run: |
          set -euo pipefail
          RECIPE_VERSION="$(python3 -c "
          import re, pathlib
          m = re.search(r'^\s*version\s*=\s*[\"\'']([^\"\'\']+)[\"\'']',
                        pathlib.Path('conanfile.py').read_text(), re.M)
          print(m.group(1) if m else '')
          ")"
          if [[ "$RECIPE_VERSION" != "${{ steps.tag.outputs.version }}" ]]; then
            echo "::error::conanfile.py version='$RECIPE_VERSION' != tag '${{ steps.tag.outputs.tag }}'"
            exit 1
          fi

      - name: Build package
        run: |
          conan create . \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing \
            --build-test=missing

      - name: Export Conan tarball
        run: |
          set -euo pipefail
          mkdir -p release-assets
          PKG_VER="${{ steps.tag.outputs.version }}"
          conan cache save "insight_metalog/${PKG_VER}:*" \
            --file="release-assets/insight_metalog-${PKG_VER}.tgz"
          ls -lh release-assets/

      - name: Attach tarball to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated Conan-package release for $TAG.

          The attached \`.tgz\` is produced by \`conan cache save\` and consumed
          downstream by \`conan cache restore\`."
          fi
          gh release upload "$TAG" release-assets/*.tgz --clobber
