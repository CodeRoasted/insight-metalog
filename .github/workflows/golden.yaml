name: Determinism Golden Proof

# The cross-toolchain / cross-ISA / cross-OS bit-identity gate for the canon+metalog TOWER — metalog's
# leg of the "same input → same output, bit-for-bit" claim. Merges the three former probes
# (superproject determinism-gate Linux diagonal, arm64-determinism-probe, windows-portability-probe)
# into ONE matrix + a compare, mirroring canon's golden.yaml:
#
#   5 legs — gcc-x86 · clang-x86 · gcc-arm64 · clang-arm64 · msvc — each builds the canon+metalog MODULE
#   TOWER FROM SOURCE (Approach-B det_harness: add_subdirectory(canon)+add_subdirectory(metalog) + the
#   determinism_fixture) and EMITS its digest over the committed corpus (scripts/determinism_corpus/,
#   off disk) plus every synthetic scenario in scripts/determinism_sections.txt, which owns that
#   roster and the reason each row is in it. WHAT is replayed is NOT enumerated here or in any
#   emitter: an enumeration written twice is what put the MSVC leg two sections behind the Linux
#   legs on 2026-08-24, under a compare that demands five byte-identical digests. The compare job
#   asserts all five agree: that IS the proof (no committed golden to go stale). Any divergence
#   FAILS, gating the release. The agreed digest is uploaded as `determinism-golden` — the Release
#   attaches it (per-release artifact, never committed).
#
# WHY canon FROM SOURCE (the difference vs canon's own golden): only the gcc-x86 insight_canon binary is
# PUBLISHED (the Release tarball). The clang / arm64 / MSVC legs need canon compiled under THEIR
# toolchain/ISA/OS, so each leg checks out insight-canon SOURCE (public, anonymous) and the det_harness
# rebuilds it from source under the cell's flags — the real determinism test hits canon's codegen too.
#
# PUBLIC + anonymous: anyone can fork metalog + canon and reproduce it. arm64 + msvc run on HOSTED runners
# only (a self-hosted runner on a public repo = fork-PR RCE); hosted minutes are free. No secret is read:
# the candidate hands the canon commit as an input.
#
# The `compare` job carries a SECOND, independent gate over the same artifact: the agreed digest is
# validated against the PUBLISHED MetaLog schema (metalog-spec SPEC §8 clauses 1 and 4) before it is
# uploaded. Byte-identity and conformance are different properties — five legs can agree perfectly on
# bytes that no longer match the standard — and this is the only place both are asked of the exact
# bytes the Release attaches. Logic: scripts/spec_conformance_gate.sh.
#
# THE LEGS ARE malf-toolchain's `coderoast-golden-proof.yml` (ROADMAP N357: one workflow source), and
# so are the `subjects` resolution below and the two cheap guards in front of the legs. This file names
# only what metalog proves: scripts/determinism_bitidentity.sh on Linux, scripts/determinism_msvc.ps1
# on MSVC, the tower's editables, and the guards — scripts/determinism_sections_check.sh (the section
# roster ≡ the fixture's dispatch) and scripts/determinism_emit_check.sh (the digest writer ≡ the
# fixture's exit status). Both guards are committed scripts that need no toolchain, so a divergence
# reds in seconds and buys no metered minute.
#
# Runs on every PR to main (full matrix — determinism caught in the PR) + the candidate's gate
# (workflow_call; its store job ingests the agreed digest, which the Release publishes from the candidate,
# DN-142.D33) + a weekly drift catch + manual dispatch.
#
# WHICH insight-canon (and metalog-spec) THE TOWER READS — the reusable workflow's `subjects` job resolves
# the source ref in this order, and the order is the contract:
#   1. `inputs.canon_ref` — the candidate's call (the commit its upstream canon candidate records), or a
#      manual dispatch of THIS workflow (an epic branch for a cross-repo cascade);
#   2. `github.ref_name` when `github.ref_type == 'tag'` — release.yaml fired by a tag push (under
#      `workflow_call` the `github` context is the CALLER's, so this is the package tag itself);
#   3. `main` — the schedule and pull_request (whose ref_name is `N/merge`, never a sibling ref).
# 2 pins insight-canon to the SAME tag as this repo's: the cut tags in lockstep (canon in Wave 1, metalog in
# Wave 2, eidos in Wave 3), so the sibling tag exists before this gate runs, and a tag-time gate never
# reads a moving `main`. A missing sibling tag is a checkout RED, never a fallback.

permissions:
  contents: read
  actions: read   # malf's conan cache restore reads each leg's runner group (actions-cache-allowed.sh)

on:
  workflow_call:
    inputs:
      canon_ref:
        description: 'The insight-canon commit the tower builds: the candidate passes the one its upstream canon candidate records.'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      canon_ref:
        description: 'Ref to build the insight-canon SOURCE dep at — main (default) or an epic branch when validating a cross-repo cascade (the tower is mid-flight on that branch).'
        default: 'main'
        required: false
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — drift catch

jobs:
  proof:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-golden-proof.yml@4a570ef5d4964ddd9e31b45581d16ec974eec8c5
    with:
      linux-proof: scripts/determinism_bitidentity.sh
      msvc-proof: scripts/determinism_msvc.ps1
      guards: |
        bash scripts/determinism_sections_check.sh
        bash scripts/determinism_emit_check.sh
      tower: true
      global-conf: true
      # `conan install .` resolves metalog's FULL graph, test_requires included, so every first-party
      # dep must be satisfiable: canon core and insight_semantic_github (a SEPARATE package inside the
      # same canon tree since ADR-17) as editables, 1:1 with metalog's first-party deps.
      linux-seed: |
        conan editable add _canon/core
        conan editable add _canon/semantic/github
        conan editable add .
      canon-ref: ${{ inputs.canon_ref }}

  compare:
    # A failed or skipped leg never SKIPS the verdict (ROADMAP N370): the compare runs on every
    # run not cancelled, and its min-legs check names the missing digests.
    needs: [proof]
    if: ${{ !cancelled() }}
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-golden-compare.yml@4a570ef5d4964ddd9e31b45581d16ec974eec8c5
    with:
      min-legs: '5'
      spec-ref: ${{ needs.proof.outputs.spec }}
