name: CI

on:
  # `deps` declares how the upstream first-party packages reach the cache. The release workflow
  # passes `vendor` (the tarballs of the waves cut before it), so a caller must say it; a dispatch
  # defaults to `build` (each upstream created from its repository's main), because between two
  # cuts the open version has no release to download. A pull_request run carries no inputs and
  # takes the same `build`.
  workflow_call:
    inputs:
      deps:
        description: 'vendor (release tarballs) | build (upstreams from their main)'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      deps:
        description: 'vendor (release tarballs) | build (upstreams from their main)'
        type: choice
        options: [build, vendor]
        default: build
  pull_request:
    branches: [ main ]

jobs:
  ci:
    permissions:
      contents: read
      actions: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-ci.yml@f8d7419618012dd0baae4fd7423735b5d3da0124
    with:
      # metalog takes insight_canon from the PUBLIC canon repository (its release under `deps: vendor`,
      # its main under `deps: build`), then builds the single root package
      # (test=true runs the full gtest suite; create=true verifies packaging + test_package).
      # insight_semantic_github is a SEPARATE package (ADR-17.D8 — canon is multi-package) from the
      # SAME canon repository; the vendor loop handles one package per row, so it needs its own row
      # even though it comes from the same repo+tag. metalog test_requires it (conanfile.py) — without
      # the row the gtest suite cannot resolve it. Keep both rows pinned together on a canon bump.
      deps: ${{ inputs.deps || 'build' }}
      vendor: |
        insight_canon 1.10.7 CodeRoasted/insight-canon public
        insight_semantic_github 1.10.7 CodeRoasted/insight-canon public
      modules: '.'
      # PUBLIC repo: sift-mode: public renders the Sift comment fork-safe (read-only token); the
      # sift-post job below posts it.
      sift-mode: public
    secrets: inherit

  # Post the comment the `ci` build rendered to the sift-comment artifact. Separate job so `ci` (which
  # runs PR code) stays read-only; only THIS job holds pull-requests: write, and it runs no PR code —
  # it just posts the pre-rendered artifact of this same run. Same-repo PRs only: a fork PR's
  # pull_request run is read-only, so posting is capped anyway (external forks get no comment).
  sift-post:
    needs: ci
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true }}
    permissions:
      pull-requests: write
      actions: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-sift-post.yml@f8d7419618012dd0baae4fd7423735b5d3da0124
    with:
      run-id: ${{ github.run_id }}
    secrets: inherit
