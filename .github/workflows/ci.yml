name: CI
permissions:
  contents: write
  pull-requests: write   # Sift dogfood: comment on same-repo PRs + seed on push; fork PRs skipped (read-only token anyway)
  actions: write         # Sift dogfood: upload the baseline-log artifact (+ read for last-green resolution)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      INSIGHT_CANON_REPO: CodeRoasted/insight-canon
      CR_PIN_INSIGHT_CANON: '1.4.3'

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip build-essential g++-15 clang-tidy

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.28.1"
          home: ${{ env.CONAN_HOME }}
          cache_packages: true
          profile_detect: false

      - name: Setup Conan profile
        run: |
          mkdir -p "$CONAN_HOME/profiles"
          cp linux-gcc15-release "$CONAN_HOME/profiles/linux-gcc15-release"

      - name: Vendor insight_canon from insight-canon release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_fetch_conan_package.sh insight_canon "$CR_PIN_INSIGHT_CANON" "$INSIGHT_CANON_REPO"

      - name: Start build-log capture (the conan-module step below appends; Sift diffs it)
        run: truncate --size 0 "$GITHUB_WORKSPACE/build.log"

      - name: Build and test
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1   # capture the conan-module output for the Sift dogfood
          conan create . \
            --profile:host="$CONAN_HOME/profiles/linux-gcc15-release" \
            --profile:build="$CONAN_HOME/profiles/linux-gcc15-release" \
            --build=missing \
            --build-test=missing

      - name: Sift — structural diff of this run's build+test log (advisory)
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        continue-on-error: true    # advisory: a Sift error must NEVER fail this build
        uses: CodeRoasted/sift-action@v1
        with:
          log: build.log
          fail-on: none
          commit-comment: regression
          build-status: ${{ job.status == 'success' && 'green' || 'red' }}
