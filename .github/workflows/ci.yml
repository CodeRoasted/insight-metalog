name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  ci:
    permissions:
      contents: read
      actions: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-ci.yml@63fb55b5b69fdf3f2a3f514d573f6196c13f41ba
    with:
      # metalog vendors insight_canon from its PUBLIC release, then builds the single root package
      # (test=true runs the full gtest suite; create=true verifies packaging + test_package).
      # insight_semantic_github is a SEPARATE package (ADR 0024 made canon multi-package) shipped in
      # the SAME canon release; the vendor loop restores one package per row, so it needs its own row
      # even though it comes from the same repo+tag. metalog test_requires it (conanfile.py) — without
      # the row the gtest suite cannot resolve it. Keep both rows pinned together on a canon bump.
      vendor: |
        insight_canon 1.9.6 CodeRoasted/insight-canon public
        insight_semantic_github 1.9.6 CodeRoasted/insight-canon public
      modules: '.'
      # PUBLIC repo: sift-mode: public renders the Sift comment fork-safe (read-only token); the
      # sift-post job below posts it.
      sift-mode: public
    secrets: inherit

  # Post the comment the `ci` build rendered to the sift-comment artifact. Separate job so `ci` (which
  # runs PR code) stays read-only; only THIS job holds pull-requests: write, and it runs no PR code —
  # it just posts the pre-rendered artifact of this same run. Same-repo PRs only: a fork PR's
  # pull_request run is read-only, so posting is capped anyway (external forks get no comment).
  sift-post:
    needs: ci
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true }}
    permissions:
      pull-requests: write
      actions: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-sift-post.yml@63fb55b5b69fdf3f2a3f514d573f6196c13f41ba
    with:
      run-id: ${{ github.run_id }}
    secrets: inherit
