name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-lint.yml@b0c09342ef9e4bda9aa821d8b89e97adea6c14d6
    # PUBLIC repo: no runs-on passthrough and no checkout token — a fork PR runs this job.
    with:
      # clang-tidy runs (the default), over a clang-21 source build of this repo's whole first-party
      # closure. These are the repos that closure reaches, held to packages.yml by the superproject's
      # pin_coherence check module's INV-13. A private one would fail its clone loudly, never be
      # skipped.
      lint-siblings: insight-canon
