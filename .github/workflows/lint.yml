name: Lint

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-lint.yml@eed598dfbab97c148ec94050588de9b769d5f947
    with:
      # `lint` (clang-tidy) is OFF, and it is a MECHANISM gap rather than a findings one. That gate
      # builds a clang-21 compile database, and this repo's recipes require first-party packages
      # that live in OTHER repos: a standalone CI checkout has no siblings to register as editables,
      # and the vendored release assets cannot stand in — they are linux-gcc16-release binaries, and
      # a conan package_id is keyed on the compiler. So the gate could not PASS here for any source,
      # which is strictly worse than an absent one: a red that is not about the code is how a gate
      # stops being read. Owner: Argos; `coderoast-lint-tidy`'s own description names the shape that
      # closes it (the sibling-checkout layout insight-twin/ci.yml already uses).
      lint: false
