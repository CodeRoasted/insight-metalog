name: Windows · msvc vs golden

# STANDING GATE (release-blocking) — the metalog leg of the cross-OS bit-identity contract.
# (Promoted from a staged probe 2026-06-18 per Daidalos's gate-promotion handoff.)
#
# Asserts the canon→metalog MetaLog document is byte-identical to the committed Linux golden
# (scripts/determinism_golden.sha256) on MSVC 14.52, across the -O × -fp SWEEP — the four corners
#   {/Od,/O2} × {/fp:precise,/fp:fast}
# hardening the digest against optimization level AND float contraction/reassociation (MSVC /fp:precise
# is the no-contraction floor; /fp:fast turns it on). Every cell matching the one shared golden is part
# of what converts "measured-green MSVC" into the Tier-1 "tri-toolchain bit-identical" claim; a red cell
# un-promotes the claim and blocks the cut.
#
# WHY MSVC: clang ships no libc++ on Windows → no `import std`; MSVC cl.exe is the only mature C++23
# named-modules + import-std path. New 3rd-party surfaces beyond canon = glaze + picosha2.
#
# Each cell builds the Approach-B det_harness (scripts/det_harness: add_subdirectory(canon)+(metalog) +
# determinism_fixture) FROM SOURCE under the cell's -O/-fp (CELL_FLAGS, alongside SPDLOG_ACTIVE_LEVEL=OFF),
# runs it over scripts/determinism_corpus, reproduces the golden's exact bytes ("### <file> ###\n" + the
# two JSON docs, LF; the fixture _setmode's stdout to binary), and sha256-compares to the committed
# golden. canon source isn't in any conan remote, so the cell checks out canon's main + `conan export`s
# it (the from-source cross-OS shape).
#
# Freshness anchor: this asserts scripts/determinism_golden.sha256 — the SAME golden the Linux
# determinism gate freezes + asserts — so an intended engine change forces a refreeze on Linux before
# this can pass (see [[determinism-golden-freshness-gate]]). The golden value is NOT hardcoded in this
# header (it would rot, as the old fd25f9f3→e23bb639 0.5.0→0.6.0 bump showed) — the file is the source.

permissions:
  contents: read

on:
  # The determinism-gate cadence: the release-tag cut (auto-runs, gating the tag) + a weekly drift
  # catch + manual dispatch. NOT per-PR — per-PR coverage is metalog's own golden unit tests.
  workflow_dispatch:
    inputs:
      sibling_ref:
        description: 'Ref to check out the canon SOURCE dep at — main (default), or an epic branch when validating a cross-repo cascade pre-merge (the goldens are mid-flight on that branch).'
        default: 'main'
        required: false
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

jobs:
  msvc-sweep:
    name: msvc ${{ matrix.tag }} vs golden
    runs-on: windows-2025
    strategy:
      fail-fast: false   # report every cell; a red cell fails the leg
      matrix:
        include:
          - { opt: '/Od', fp: '/fp:precise', tag: 'Od-precise' }
          - { opt: '/O2', fp: '/fp:precise', tag: 'O2-precise' }
          - { opt: '/Od', fp: '/fp:fast',    tag: 'Od-fast' }
          - { opt: '/O2', fp: '/fp:fast',    tag: 'O2-fast' }
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - uses: actions/checkout@v5

      - name: Check out malf-toolchain into malf/ (canonical conan profile; public, anonymous)
        uses: actions/checkout@v5
        with:
          repository: CodeRoasted/malf-toolchain
          path: malf
          fetch-depth: 1
          persist-credentials: false

      - name: Install + activate MSVC 14.52 (the fix floor; not pre-installed on the runner)
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-msvc1452@main

      - name: Verify the active toolset is MSVC 14.52, not a fallback
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { Write-Error "cl.exe not on PATH — MSVC env not activated"; exit 1 }
          Write-Host "active VCToolsVersion: $env:VCToolsVersion"
          if (-not $env:VCToolsVersion) { Write-Error "VCToolsVersion not set — MSVC env not activated"; exit 1 }
          if ([version]$env:VCToolsVersion -lt [version]'14.52') { Write-Error "active toolset $env:VCToolsVersion < 14.52 (the fix floor)"; exit 1 }

      - name: Setup CMake 4.3.x (the import-std experimental gate UUID 451f2fe2 lives only in 4.3.x)
        shell: pwsh
        run: |
          python -m pip install "cmake==4.3.1"
          $v = (cmake --version | Select-Object -First 1)
          if ($v -notmatch ' 4\.3\.') { Write-Error "expected CMake 4.3.x (got: $v)"; exit 1 }
          cmake --version

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.29.0"
          home: ${{ env.CONAN_HOME }}
          cache_packages: false
          profile_detect: false

      - name: Cache conan dep binaries (per cell — keyed on the dep set + profile + cell)
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-msvc1452-${{ matrix.tag }}-${{ runner.os }}-${{ hashFiles('**/conanfile.py', 'malf/profiles/windows-msvc-release') }}
          restore-keys: |
            conan-msvc1452-${{ matrix.tag }}-${{ runner.os }}-

      - name: Setup Conan profile (windows-msvc-release, from malf-toolchain)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CONAN_HOME/profiles" | Out-Null
          Copy-Item malf/profiles/windows-msvc-release "$env:CONAN_HOME/profiles/windows-msvc-release"

      - name: Check out insight-canon source (canon's MSVC port; sibling_ref=main by default, the epic branch when validating a cascade)
        uses: actions/checkout@v5
        with:
          repository: CodeRoasted/insight-canon
          ref: ${{ inputs.sibling_ref || 'main' }}
          path: _canon

      - name: Export insight_canon (recipe + sources) into the local cache
        # `conan export` registers canon's recipe+exports_sources WITHOUT building; the install below
        # resolves the graph (canon + glaze/picosha2/simdjson/…) for os=Windows. The export'd version
        # must equal the insight_canon pin in conanfile.py; a canon main version bump fails loudly here.
        shell: pwsh
        run: |
          conan export _canon
          conan list "insight_canon/*#*"

      - name: Build det_harness @ cell ${{ matrix.tag }} + measure vs the Linux golden (GATING)
        # The det_harness builds canon+metalog FROM SOURCE (add_subdirectory CANON_ROOT/META_ROOT) under
        # this cell's -O/-fp, so the cell flags hit the ENGINE codegen — the real determinism test. The
        # det_fixture imports insight.metalog (CXX_MODULE_STD ON) → this build IS the MSVC module-compile
        # proof, so no separate conan-create smoke is needed. GATING: a build failure OR a digest mismatch
        # fails the cell (no continue-on-error) — un-promotes the cross-OS claim + blocks the cut.
        # pwsh (not bash): bash's `link` shadows MSVC link.exe.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $prof = "$env:CONAN_HOME/profiles/windows-msvc-release"
          $work = "$env:RUNNER_TEMP/det-measure"
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          # Resolve metalog's deps (+ canon from the export) + a conan toolchain for the standalone harness.
          conan install . --profile:host="$prof" --profile:build="$prof" --build=missing -of "$work/conan"
          $toolchain = (Get-ChildItem -Recurse "$work/conan" -Filter conan_toolchain.cmake | Select-Object -First 1).FullName
          if (-not $toolchain) { Write-Error "no conan_toolchain.cmake from conan install"; exit 1 }

          # CELL_FLAGS = SPDLOG-off + this cell's -O/-fp (cl last-wins resolves /Od over Release's /O2).
          cmake -S scripts/det_harness -B "$work/build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCANON_ROOT="$env:GITHUB_WORKSPACE/_canon" `
            -DMETA_ROOT="$env:GITHUB_WORKSPACE" `
            -DCELL_FLAGS="-DSPDLOG_ACTIVE_LEVEL=SPDLOG_LEVEL_OFF ${{ matrix.opt }} ${{ matrix.fp }}"
          cmake --build "$work/build" --target det_fixture --parallel 2
          $fixture = (Get-ChildItem -Recurse "$work/build" -Filter det_fixture.exe | Select-Object -First 1).FullName
          if (-not $fixture) { Write-Error "det_fixture.exe not produced — MSVC det harness build failed at cell ${{ matrix.tag }}"; exit 1 }

          # Reproduce the golden's EXACT bytes: per sorted corpus file, "### <name> ###\n" (LF) then the
          # fixture's RAW stdout (binary via _setmode). Accumulate as bytes — no pwsh CRLF.
          $outPath = "$work/msvc.out"
          $fs = [System.IO.File]::Create($outPath)
          try {
            Get-ChildItem "scripts/determinism_corpus/*.log" | Sort-Object Name | ForEach-Object {
              $hdr = [System.Text.Encoding]::ASCII.GetBytes("### $($_.Name) ###`n")
              $fs.Write($hdr, 0, $hdr.Length)
              $tmp = "$work/fixture.out"
              $p = Start-Process -FilePath $fixture -ArgumentList "`"$($_.FullName)`"" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $tmp
              if ($p.ExitCode -ne 0) { throw "det_fixture failed (exit $($p.ExitCode)) on $($_.Name)" }
              $bytes = [System.IO.File]::ReadAllBytes($tmp)
              $fs.Write($bytes, 0, $bytes.Length)
            }
          } finally { $fs.Close() }

          $sha = (Get-FileHash $outPath -Algorithm SHA256).Hash.ToLower()
          $golden = (Get-Content "scripts/determinism_golden.sha256" -Raw).Trim().ToLower()
          Copy-Item $outPath "$env:GITHUB_WORKSPACE/metalog_msvc_determinism.txt"
          Write-Host "cell ${{ matrix.tag }} — MSVC metalog digest: $sha"
          Write-Host "cell ${{ matrix.tag }} — Linux golden:        $golden"
          if ($sha -ne $golden) {
            Write-Host "::error::cell ${{ matrix.tag }} CROSS-OS DIVERGENCE — metalog MSVC digest != Linux golden"
            $g = Get-Content "scripts/determinism_golden.txt"
            $m = Get-Content $outPath
            for ($i = 0; $i -lt [Math]::Max($g.Count, $m.Count); $i++) {
              if ($g[$i] -ne $m[$i]) {
                Write-Host "first divergent line $($i + 1):"
                Write-Host "  golden: $($g[$i])"
                Write-Host "  msvc  : $($m[$i])"
                break
              }
            }
            exit 1
          }
          Write-Host "::notice::cell ${{ matrix.tag }} GOLDEN MATCH — metalog cross-OS bit-identical (MSVC == Linux)"

      - name: Upload MSVC determinism output @ ${{ matrix.tag }} (divergence localization)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: metalog-msvc-determinism-${{ matrix.tag }}
          path: metalog_msvc_determinism.txt
          if-no-files-found: ignore
