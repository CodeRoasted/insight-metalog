name: Windows Portability Probe

# STAGED PROBE — not yet a ship gate (Argos 2026-06-13; determinism measure wired 2026-06-14).
#
# Second leg of the canon→metalog→eidos cross-OS port. canon is proven cross-OS bit-identical on
# MSVC/Windows (its det_proof digest == its Linux golden); metalog sits on canon, next toward the
# Windows Sift CLI. metalog COMPILES green on MSVC (the whole canon→metalog→eidos tower does). Its own
# __int128 (HLL + KL/JS/entropy) was ported to canon's portable det::u128/i128 shim, and the HLL
# double→128 to deterministic integer bit-extraction (commit 41af4fc); both Linux toolchains stay
# 132/132 and the determinism diagonal byte-identical.
#
# WHY MSVC (proven on canon): clang ships no libc++ on Windows → no `import std` there. MSVC cl.exe
# is the only mature C++23 named-modules + import-std path (ships std.ixx; CMake supports it under
# Ninja). New 3rd-party surfaces beyond canon = glaze (template-heavy JSON reflection) + picosha2 —
# the probe's first real unknowns.
#
# RESOLVING CANON: insight_canon/1.5.3 is published to NO conan remote (we don't push to conancenter)
# and has no Release tarball yet (a release is the Founder's signed tag; it would be linux-gcc15 only —
# canon's release-publish never builds Windows). So the probe checks out canon's main (which carries
# the MSVC port + version 1.5.3) and `conan export`s its recipe+sources into the cache; canon then
# builds FROM SOURCE for os=Windows alongside glaze/picosha2 — the right shape for a source-build probe.
#
# SCOPE = COMPILE GATE + DETERMINISM MEASURE (two steps):
#  (1) COMPILE GATE — `conan create .` builds canon + glaze + picosha2 + metalog for os=Windows and the
#      test_package consumer (which `import insight.metalog` + is CXX_MODULE_STD ON): the modules tower
#      COMPILES + links + resolves on MSVC.
#  (2) DETERMINISM MEASURE — build the Approach-B det_harness (canon+metalog module tower +
#      determinism_fixture) under MSVC, run it over scripts/determinism_corpus, reproduce the golden's
#      exact bytes, and sha256-compare to scripts/determinism_golden.sha256 (fd25f9f3…). The golden is
#      ASCII-only and the fixture _setmode's stdout to binary (canon's em-dash/CRLF/log-leak lessons
#      pre-applied). Needs the same insight-canon checkout the compile gate uses (the harness builds the
#      tower from source). MEASURE-ONLY: a divergence is a real finding (localized + artifacted), not yet
#      a ship gate.
#
# POSTURE: NOT a required check, NOT continue-on-error — real red or real green so we learn the true
# state. Cannot gate a ship until green once. Tier-1 cross-OS promotion = Daidalos's call.

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'windows-msvc-release'
      - '.github/workflows/windows-portability-probe.yml'

jobs:
  windows-msvc-probe:
    # PINNED windows-2022 (VS 2022, toolset v143/MSVC 19.4x — conan compiler.version=194). The
    # windows-latest runner migrates to VS 2026 mid-2026; pin for a stable toolset.
    runs-on: windows-2022
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC dev environment (puts cl.exe / link.exe on PATH for Ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify cl.exe is the active compiler (fail here, not later with a cryptic error)
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { Write-Error "cl.exe not on PATH — MSVC env not activated"; exit 1 }
          cl.exe 2>&1 | Select-Object -First 1

      - name: Setup CMake 4.3.x (the import-std experimental gate UUID 451f2fe2 lives only in 4.3.x)
        shell: pwsh
        run: |
          python -m pip install "cmake==4.3.1"
          $v = (cmake --version | Select-Object -First 1)
          if ($v -notmatch ' 4\.3\.') { Write-Error "expected CMake 4.3.x (got: $v)"; exit 1 }
          cmake --version

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.29.0"
          home: ${{ env.CONAN_HOME }}
          cache_packages: false
          profile_detect: false

      - name: Cache conan dep binaries (openssl/boost/drogon/… — keyed on the dep set + profile)
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-msvc-${{ runner.os }}-${{ hashFiles('**/conanfile.py', 'windows-msvc-release') }}
          restore-keys: |
            conan-msvc-${{ runner.os }}-

      - name: Setup Conan profile (windows-msvc-release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CONAN_HOME/profiles" | Out-Null
          Copy-Item windows-msvc-release "$env:CONAN_HOME/profiles/windows-msvc-release"

      - name: Check out insight-canon source (the MSVC port lives on canon's main, not in any conan remote)
        # metalog requires insight_canon/1.5.3, but that package exists NOWHERE conan can reach on a
        # fresh Windows runner: we publish nothing to conancenter, and no v1.5.3 canon Release tarball
        # exists yet (a release is the Founder's signed-tag trigger — and it would be a LINUX-gcc15
        # binary regardless; canon's release-publish never builds Windows). canon's main IS the source
        # of truth: it carries the cross-OS MSVC port + version=1.5.3. So fetch it and build from source.
        uses: actions/checkout@v4
        with:
          repository: CodeRoasted/insight-canon
          ref: main
          path: _canon

      - name: Export insight_canon/1.5.3 (recipe + sources) into the local cache
        # `conan export` registers canon's recipe+exports_sources in the cache WITHOUT building a binary;
        # the `conan create` below then compiles insight_canon FROM SOURCE for os=Windows via --build=missing,
        # exactly like glaze/picosha2. This is the right shape for a source-build cross-OS probe (vs the
        # Linux gates, which vendor canon's prebuilt linux-gcc15 Release tarball — wrong ISA here, and
        # the point of THIS probe is the from-source MSVC compile). The export'd version must equal the
        # `insight_canon/1.5.3` pin in conanfile.py; a canon main version bump fails loudly here (pin drift).
        shell: pwsh
        run: |
          conan export _canon
          conan list "insight_canon/1.5.3#*"

      - name: Probe — conan create on Windows/MSVC (canon+glaze+picosha2+metalog tower + consumer)
        # The real test of C++23 named modules + import std under MSVC for the metalog tower: conan
        # create builds insight_canon (from the recipe just exported above), glaze, picosha2 (all
        # --build=missing for os=Windows from source — no prebuilt Windows packages exist), then
        # metalog's CXX_MODULE_STD lib, then test_package/ (a consumer that import insight.metalog +
        # is itself CXX_MODULE_STD ON), then runs its smoke test. NUMA is absent (canon gates libnuma
        # to os==Linux). pwsh (not bash): bash's `link` shadows link.exe.
        shell: pwsh
        run: |
          conan create . `
            --profile:host="$env:CONAN_HOME/profiles/windows-msvc-release" `
            --profile:build="$env:CONAN_HOME/profiles/windows-msvc-release" `
            --build=missing

      - name: Determinism measure — metalog MSVC digest vs the frozen Linux golden (fd25f9f3…)
        # The GREEN-GATED follow-up the probe always named (canon precedent). Does the canon→metalog
        # tower emit a BIT-IDENTICAL MetaLog document on MSVC vs Linux? Build the Approach-B det_harness
        # (canon+metalog module tower + determinism_fixture) under MSVC, run it over the SAME
        # scripts/determinism_corpus, reproduce the golden's exact bytes ("### <file> ###\n" + the two
        # JSON docs, LF — the fixture _setmode's stdout to binary), sha256, compare to
        # scripts/determinism_golden.sha256. metalog's twin of canon's det_proof digest match.
        # MEASURE-ONLY (Daidalos): a divergence is a real finding to localize (per-section diff +
        # artifact below), not yet a ship gate; Tier-1 cross-OS promotion is Daidalos's call.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $prof = "$env:CONAN_HOME/profiles/windows-msvc-release"
          $work = "$env:RUNNER_TEMP/det-measure"
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          # 1) Resolve metalog's deps (simdjson/spdlog/fmt/glaze/picosha2) + a conan toolchain for the
          #    standalone harness CMake. canon was exported earlier; --build=missing builds it for Windows.
          conan install . --profile:host="$prof" --profile:build="$prof" --build=missing -of "$work/conan"
          $toolchain = (Get-ChildItem -Recurse "$work/conan" -Filter conan_toolchain.cmake | Select-Object -First 1).FullName
          if (-not $toolchain) { Write-Error "no conan_toolchain.cmake from conan install"; exit 1 }

          # 2) Configure + build det_harness under MSVC. CELL_FLAGS = SPDLOG-off ONLY (NO -ffp-contract=off
          #    — that is a gcc/clang flag MSVC rejects; MSVC /fp:precise is the portable floor).
          cmake -S scripts/det_harness -B "$work/build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCANON_ROOT="$env:GITHUB_WORKSPACE/_canon" `
            -DMETA_ROOT="$env:GITHUB_WORKSPACE" `
            -DCELL_FLAGS="-DSPDLOG_ACTIVE_LEVEL=SPDLOG_LEVEL_OFF"
          cmake --build "$work/build" --target det_fixture --parallel 2
          $fixture = (Get-ChildItem -Recurse "$work/build" -Filter det_fixture.exe | Select-Object -First 1).FullName
          if (-not $fixture) { Write-Error "det_fixture.exe not produced"; exit 1 }

          # 3) Reproduce the golden's EXACT bytes: per sorted corpus file, "### <name> ###\n" (LF) then
          #    the fixture's RAW stdout (binary via _setmode). Accumulate as bytes — no pwsh CRLF.
          $outPath = "$work/msvc.out"
          $fs = [System.IO.File]::Create($outPath)
          try {
            Get-ChildItem "scripts/determinism_corpus/*.log" | Sort-Object Name | ForEach-Object {
              $hdr = [System.Text.Encoding]::ASCII.GetBytes("### $($_.Name) ###`n")
              $fs.Write($hdr, 0, $hdr.Length)
              $tmp = "$work/fixture.out"
              $p = Start-Process -FilePath $fixture -ArgumentList "`"$($_.FullName)`"" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $tmp
              if ($p.ExitCode -ne 0) { throw "det_fixture failed (exit $($p.ExitCode)) on $($_.Name)" }
              $bytes = [System.IO.File]::ReadAllBytes($tmp)
              $fs.Write($bytes, 0, $bytes.Length)
            }
          } finally { $fs.Close() }

          # 4) Compare digest to the frozen Linux golden.
          $sha = (Get-FileHash $outPath -Algorithm SHA256).Hash.ToLower()
          $golden = (Get-Content "scripts/determinism_golden.sha256" -Raw).Trim().ToLower()
          Copy-Item $outPath "$env:GITHUB_WORKSPACE/metalog_msvc_determinism.txt"
          Write-Host "MSVC metalog determinism digest: $sha"
          Write-Host "Linux golden:                    $golden"
          if ($sha -ne $golden) {
            Write-Host "::error::CROSS-OS DIVERGENCE — metalog MSVC digest != Linux golden"
            $g = Get-Content "scripts/determinism_golden.txt"
            $m = Get-Content $outPath
            for ($i = 0; $i -lt [Math]::Max($g.Count, $m.Count); $i++) {
              if ($g[$i] -ne $m[$i]) {
                Write-Host "first divergent line $($i + 1):"
                Write-Host "  golden: $($g[$i])"
                Write-Host "  msvc  : $($m[$i])"
                break
              }
            }
            exit 1
          }
          Write-Host "GOLDEN MATCH — metalog cross-OS bit-identical (MSVC == Linux)"

      - name: Upload MSVC determinism output (divergence localization)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: metalog-msvc-determinism
          path: metalog_msvc_determinism.txt
          if-no-files-found: ignore
