name: Release

# On a vX.Y.Z tag (or manual re-run): attest -> CI -> Determinism Golden Proof (gate) -> Release ->
# attach the golden. The golden gate runs the 5-leg cross-toolchain/ISA/OS matrix (canon+metalog tower
# from source) and only proceeds if every leg's digest is byte-identical; the agreed digest (the
# validated golden) is then attached to the Release as a per-release artifact (never committed). CI is
# the single tag entry point. The lint is step 0's (ADR-2.D3): this tag re-runs none of it.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write        # release + attach-golden create/upload the Release
  # Sift needed permissions (PR + actions write)
  pull-requests: write
  actions: write

jobs:
  # ── The tag's ONE gate: the tagged tree is the tree step 0 judged ─────────────────────────────
  # malf-toolchain's `coderoast-attest.yml` proves that the commit this tag points at is the commit
  # step 0's build record (`pharos-build.yml` in the private superproject) verified for this
  # repository, and refuses the tag otherwise (DN-108.D7). Every other job in this file `needs:
  # attest`, so a refusal lands before anything builds or publishes; `pin_coherence` INV-22 holds
  # that shape in every releasing repository. Hosted (no `runs-on`): it compiles nothing, and a
  # release path takes no self-hosted runner it does not need. `BUILD_RECORD_READ_TOKEN` is a
  # fine-grained PAT whose only grant is `Actions: Read-only` on CodeRoasted/coderoast.
  attest:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-attest.yml@7b8d8d32ee224b3f09d116872c331c2adc087253
    secrets:
      BUILD_RECORD_READ_TOKEN: ${{ secrets.BUILD_RECORD_READ_TOKEN }}

  ci:
    needs: attest
    uses: ./.github/workflows/ci.yml
    with:
      deps: vendor
    secrets: inherit

  # The 5-leg determinism gate — blocks the release unless every leg's digest agrees.
  golden:
    needs: [attest, ci]
    uses: ./.github/workflows/golden.yaml

  release:
    needs: [attest, golden]
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-release.yml@7b8d8d32ee224b3f09d116872c331c2adc087253
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      packages: 'insight_metalog:.'
      # metalog vendors insight_canon from its PUBLIC release for the conan create. insight_semantic_github
      # is a separate package from the SAME canon release (ADR-17.D8) and needs its own row — the conan
      # create builds test_package, which reaches metalog's test_requires. Keep in sync with ci.yml.
      vendor: |
        insight_canon 1.10.7 CodeRoasted/insight-canon public
        insight_semantic_github 1.10.7 CodeRoasted/insight-canon public
      benchmark: 'insight_metalog_bench=insight-metalog'
    secrets: inherit

  # Attach the validated golden (produced by the golden gate) to the Release — per-release, not committed.
  # Asset name is kept as metalog.determinism_golden.txt so the Hub evidence pipeline (publish-to-hub.yml
  # / publish_hub_evidence.py) keeps finding it.
  attach-golden:
    needs: [attest, release, golden]
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-attach-golden.yml@7b8d8d32ee224b3f09d116872c331c2adc087253
    with:
      asset: metalog.determinism_golden.txt
