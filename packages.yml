packages:
  insight_metalog:
    path: .
    version: 1.10.9
    source_public: true
    release: true
    # insight_semantic_github is test_required (gtest suite + test_package); it must be in `depends` so
    # the released_packages DFS builds it BEFORE insight_metalog at the cut. ADR-17.D8 split it out of
    # insight_canon and this entry was never resynced.
    depends: [insight_canon, insight_semantic_github]
    # DN-142.D25 (5) call D: the verdict `insight_metalog/bench`, measured by the cut's bench job on the release seat
    # (`pharos candidates bench`, DN-142.D33 slice (a)) under `user.malf:bench`; each JSON is published under
    # the name the hub collects.
    objects:
      bench/insight_metalog_bench.json: {published: {assets: [{name: insight-metalog-benchmark.json}]}}

# ── The build system's INVENTORY (ADR-3.D9) — see insight-canon/packages.yml for the contract ───
# FOUND BY THE PREDICATE, NOT BY A SWEEP, and that is the point: the derived-clause ruling (now
# ADR-3.D9) was minted asserting `insight-canon/proof/` was the ONLY orphan, and the derived
# check found this second one of the
# identical species on its first run. A hand-kept population was already incomplete on the day it
# was written — which is precisely why the rule is "derive it", never "list it".
inventory:
  # The metalog determinism harness: same shape as canon's proof/ (a repo-level tower spanning the
  # sibling canon repo + this one), driven only by scripts/determinism_bitidentity.sh, which runs
  # only in the golden workflow. Same false-green exposure, now closed.
  metalog_det_harness:
    path: scripts/det_harness
    toolchain_from: .
    target: det_fixture
    defines:
      CANON_ROOT: ${workspace}/insight-canon
      META_ROOT: ${repo}

# DN-142.D25 (3), DN-142.D33: the hosted output this repository's candidate produces in a job of its own run —
# the determinism golden, whose arm64 and MSVC legs run on hosted runners — and its store job ingests from that
# run as the record `<repository>/ingest.<workflow stem>` (malf artefact_store.py `candidate-ingest`). The
# Release publishes it from the candidate, under the name the hub collects.
ingest:
  golden.yaml:
    artifact: determinism-golden
    object: determinism-golden.txt
    published: {assets: [{name: metalog.determinism_golden.txt}]}

# ── The deterministic-content core the determinism gates judge (malf determinism_lint.py) ────────
# Both gates — the clock (the determinism bible §7) and std <random> (§5 M7/M9) — judge every C/C++
# unit under `roots:`, one subject and one root list; every build target above that no root reaches
# is named under `out_of_scope:` with its reason. malf's coderoast-preflight.yml runs them over this
# repository; the superproject sums the `opt_outs:` budgets across repositories (DN-142.D33).
determinism:
  # scripts/det_harness is COVERED, never excluded: metalog_det_harness is a determinism-proof harness
  # (it holds no C++ today, so covering it costs nothing and reads the first unit it ever grows).
  roots:
    - src
    - api
    - scripts/det_harness
